# TimeGAN MSE Config for ETTh1 Dataset
seed_everything: 1
trainer:
  accelerator: gpu
  devices: 1
  strategy: auto
  max_epochs: 100
  use_distributed_sampler: false
  limit_train_batches: 100
  log_every_n_steps: 1
  check_val_every_n_epoch: 1
  default_root_dir: ./results
  accumulate_grad_batches: 1
  gradient_clip_val: 0.5
model:
  forecaster:
    class_path: probts.model.forecaster.prob_forecaster.time_gan_mse.TimeGANMSEModel
    init_args:
      hidden_dim: 128
      dynamic_dim: 64
      hidden_layers: 2
      patch_len: 24
      lambda_mse: 10.0
  num_samples: 100
  learning_rate: 0.001
  quantiles_num: 20
data:
  data_manager:
    class_path: probts.data.data_manager.DataManager
    init_args:
      split_val: true
      scaler: standard
  batch_size: 64
  test_batch_size: 32
  num_workers: 8
