# lightning==2.3.0.dev0
seed_everything: 1
trainer:
  accelerator: gpu
  devices: 1
  strategy: auto
  max_epochs: 100
  use_distributed_sampler: false
  limit_train_batches: 100
  log_every_n_steps: 1
  check_val_every_n_epoch: 1
  default_root_dir: ./results
  accumulate_grad_batches: 1
  gradient_clip_val: 0.5
model:
  forecaster:
    class_path: probts.model.forecaster.prob_forecaster.SpecVAE.SpecVAEModel
    init_args:
      d_model: 128
      d_ff: 256
      e_layers: 1
      dropout: 0.1
      activation: relu
      n_heads: 4
      factor: 3
      patch_len: 24
      multistep: true
      dynamic_dim: 128
      hidden_layers: 2
      hidden_dim: 256
      # SpecVAE-specific hyperparameters
      n_bands: 3               # number of frequency bands (low/mid/high)
      cross_attn_dk: 32        # cross-band attention key/query dim
      vol_hidden_dim: 64       # GRU volatility hidden dim
      alpha_init: 0.1          # cross-band gate initialization
      weight_beta: 0.001       # KL divergence weight
  num_samples: 100
  learning_rate: 0.001
  quantiles_num: 20
data:
  data_manager:
    class_path: probts.data.data_manager.DataManager
    init_args:
      split_val: true
      scaler: standard
  batch_size: 64
  test_batch_size: 32
  num_workers: 8
