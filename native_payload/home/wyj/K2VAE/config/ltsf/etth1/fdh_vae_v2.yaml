# FDH-VAE v2 config for ETTh1
seed_everything: 1
trainer:
  accelerator: gpu
  devices: 1
  strategy: auto
  max_epochs: 50
  use_distributed_sampler: false
  limit_train_batches: 100
  log_every_n_steps: 1
  check_val_every_n_epoch: 1
  default_root_dir: ./results
  accumulate_grad_batches: 1
  gradient_clip_val: 0.5
model:
  forecaster:
    class_path: probts.model.forecaster.prob_forecaster.fdh_vae_v2.FDHVAEv2Model
    init_args:
      d_model: 128
      d_ff: 256
      e_layers: 1
      dropout: 0.1
      activation: relu
      n_heads: 4
      factor: 3
      patch_len: 24
      multistep: true
      dynamic_dim: 126
      hidden_layers: 3
      hidden_dim: 256
      d_decoder: 256
      n_bands: 3
      n_encoder_layers: 2
      d_spectral_cond: 128
      beta_band: 0.1
      beta_gate: 0.05
      lambda_freq: 0.01
      sample_schedule: 20
  num_samples: 100
  learning_rate: 0.001
  quantiles_num: 20
data:
  data_manager:
    class_path: probts.data.data_manager.DataManager
    init_args:
      split_val: true
      scaler: standard
  batch_size: 64
  test_batch_size: 32
  num_workers: 8
