# lightning==2.3.0.dev0
seed_everything: 1
trainer:
  accelerator: gpu
  devices: 1
  strategy: auto
  max_epochs: 50
  use_distributed_sampler: false
  limit_train_batches: 100
  log_every_n_steps: 1
  check_val_every_n_epoch: 1
  default_root_dir: ./results
  accumulate_grad_batches: 1
  gradient_clip_val: 0.5
model:
  forecaster:
    class_path: probts.model.forecaster.prob_forecaster.DACUForecaster
    init_args:
      backbone_class_path: probts.model.forecaster.prob_forecaster.tsdiff.TSDiffCond
      adapter_mode: sample
      likelihood: laplace
      uncertainty_weight: 0.005
      consistency_weight: 0.02
      use_reliability_gate: false
      consistency_samples: 8
      forecast_mode: rescale
      calibration_strength: 0.2
      jitter_std: 0.01
      scaling_std: 0.05
      time_mask_ratio: 0.05
      channel_mask_ratio: 0.05
      freq_dropout_ratio: 0.0
      backbone_init_args:
        timesteps: 100
        hidden_dim: 64
        step_emb: 128
        num_residual_blocks: 3
        dropout: 0.0
        mode: diag
        measure: diag
        use_lags: false
        use_feat_idx_emb: false
        use_time_feat: false
        feat_idx_emb_dim: 1
        use_scaling: false
  num_samples: 100
  learning_rate: 0.001
  quantiles_num: 20
data:
  data_manager:
    class_path: probts.data.data_manager.DataManager
    init_args:
      dataset: solar_nips
      split_val: true
      scaler: temporal
      context_length: 336
  batch_size: 32
  test_batch_size: 32
  num_workers: 8
