# lightning==2.3.0.dev0
seed_everything: 1
trainer:
  accelerator: gpu
  devices: 1
  strategy: auto
  max_epochs: 50
  use_distributed_sampler: false
  limit_train_batches: 100
  log_every_n_steps: 1
  check_val_every_n_epoch: 1
  default_root_dir: ./results
  accumulate_grad_batches: 1
model:
  forecaster:
    class_path: probts.model.forecaster.prob_forecaster.DACUForecaster
    init_args:
      backbone_class_path: probts.model.forecaster.point_forecaster.itransformer.iTransformer
      adapter_mode: full
      likelihood: laplace
      uncertainty_weight: 0.005
      consistency_weight: 0.02
      use_reliability_gate: false
      consistency_samples: 8
      forecast_mode: rescale
      calibration_strength: 0.2
      jitter_std: 0.01
      scaling_std: 0.05
      time_mask_ratio: 0.05
      channel_mask_ratio: 0.05
      freq_dropout_ratio: 0.0
      backbone_init_args:
        factor: 1
        n_heads: 8
        activation: gelu
        e_layers: 2
        output_attention: false
        f_hidden_size: 256
        d_ff: 256
        label_len: 48
        use_lags: false
        use_feat_idx_emb: false
        use_time_feat: false
        feat_idx_emb_dim: 1
  num_samples: 100
  learning_rate: 0.0001
  quantiles_num: 20
data:
  data_manager:
    class_path: probts.data.data_manager.DataManager
    init_args:
      dataset: solar_nips
      split_val: true
      scaler: standard
  batch_size: 32
  test_batch_size: 32
  num_workers: 8
