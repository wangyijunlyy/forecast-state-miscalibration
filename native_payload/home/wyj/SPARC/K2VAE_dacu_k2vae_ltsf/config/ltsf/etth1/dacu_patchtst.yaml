# lightning==2.3.0.dev0
seed_everything: 1
early_stopping:
  enabled: true
  monitor: val_CRPS
  patience: 5
  min_delta: 0.0
  mode: min
trainer:
  accelerator: gpu
  devices: 1
  strategy: auto
  max_epochs: 50
  use_distributed_sampler: false
  limit_train_batches: 100
  log_every_n_steps: 1
  default_root_dir: ./results
  accumulate_grad_batches: 4
model:
  forecaster:
    class_path: probts.model.forecaster.prob_forecaster.DACUForecaster
    init_args:
      backbone_class_path: probts.model.forecaster.point_forecaster.PatchTST
      adapter_mode: full
      likelihood: laplace
      uncertainty_weight: 0.005
      consistency_weight: 0.02
      use_reliability_gate: false
      consistency_samples: 8
      forecast_mode: rescale
      calibration_strength: 0.2
      jitter_std: 0.01
      scaling_std: 0.05
      time_mask_ratio: 0.05
      channel_mask_ratio: 0.05
      freq_dropout_ratio: 0.0
      backbone_init_args:
        stride: 8
        patch_len: 16
        dropout: 0.3
        f_hidden_size: 16
        n_layers: 3
        n_heads: 4
        fc_dropout: 0.2
        head_dropout: 0
        individual: true
  learning_rate: 0.0001
  quantiles_num: 20
  num_samples: 100
data:
  data_manager:
    class_path: probts.data.data_manager.DataManager
    init_args:
      dataset: etth1
      split_val: true
      scaler: standard
      context_length: 96
      prediction_length: 96
  batch_size: 64
  test_batch_size: 32
  num_workers: 8
